        .illustration-grid > div {
            opacity: 0;
            transform: translateY(8px) scale(0.98);
            animation: fadeUp 0.6s ease-out forwards;
        }
        .illustration-grid > div:nth-child(1) { animation-delay: 0.04s; }
        .illustration-grid > div:nth-child(2) { animation-delay: 0.08s; }
        .illustration-grid > div:nth-child(3) { animation-delay: 0.12s; }
        .illustration-grid > div:nth-child(4) { animation-delay: 0.16s; }
        .illustration-grid > div:nth-child(5) { animation-delay: 0.20s; }
        .illustration-grid > div:nth-child(6) { animation-delay: 0.24s; }
        .illustration-grid > div:nth-child(7) { animation-delay: 0.28s; }
        .illustration-grid > div:nth-child(8) { animation-delay: 0.32s; }
        .illustration-grid > div:nth-child(9) { animation-delay: 0.36s; }
        .illustration-grid > div:nth-child(10) { animation-delay: 0.40s; }
        .illustration-grid > div:nth-child(11) { animation-delay: 0.44s; }
        .illustration-grid > div:nth-child(12) { animation-delay: 0.48s; }
        .illustration-grid > div:nth-child(13) { animation-delay: 0.52s; }
        .illustration-grid > div:nth-child(14) { animation-delay: 0.56s; }
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .illustration-grid > div {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
